# ---------------------------------------------------------------------------
# CI.
#
# The test matrix spans 3.9 to 3.13 because the floor is a real promise, not a
# formality: people run add-ons on whatever Python their box already has, and
# that is 3.9 on an older NAS, 3.11 on Raspberry Pi OS bookworm, and 3.12 in
# the published container image. A change that quietly uses a 3.10+ feature
# should fail here rather than in someone's print farm.
#
# Nothing in the suite touches an external network, a printer, or a real
# Notify account, so there are no secrets and nothing to configure.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, for checking against a new Python release without a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run the whole matrix even when one version fails: knowing it is only
      # 3.13 is much more useful than knowing something broke.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install pyflakes

      # Deliberately pyflakes rather than a full linter. It finds real
      # problems (undefined names, unused imports) and has no opinions about
      # formatting, so it never argues with a contributor about style.
      - name: Check
        run: python -m pyflakes src tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      # A packaging mistake is invisible until someone tries to install a
      # release, so prove the wheel installs and the console script exists.
      - name: Install the wheel and check the entry point
        run: |
          # A FRESH venv, not the job's environment: the build step above
          # installs `build` and its dependencies here, so a dependency
          # assertion made against this interpreter would be measuring the
          # toolchain rather than the wheel.
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/notify-bambuddy 2>&1 | tee /tmp/out.txt || true
          # With nothing configured it must exit non-zero and say what to set.
          # Asserting on the text is deliberate: it is the first thing any new
          # user sees, and a wheel that installs but cannot explain itself is
          # a broken release even though every test passed.
          grep -q "BAMBUDDY_URL" /tmp/out.txt
          # And the default install must pull in no third-party package. That
          # is why the image is small and why there is nothing to audit, so it
          # is worth failing the build over rather than noticing later.
          test -z "$(/tmp/fresh/bin/pip list --format=freeze \
            | grep -viE '^(pip|setuptools|wheel|notify-bambuddy)=')"
